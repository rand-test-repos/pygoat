name: Sonar Analysis

on:
  push:
    branches:
      - master
      - 'feat/**'

jobs:
  sonar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Pillow build dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sqs-dce-shichao.ngrok.io
        with:
          args: >
            -Dsonar.projectKey=rand-test-repos_PyGoat
            -Dsonar.projectName=PyGoat
            -Dsonar.python.version=3.11
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/tests.py
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Show quality gate details
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sqs-dce-shichao.ngrok.io
        run: |
          curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=rand-test-repos_PyGoat&branch=${GITHUB_REF_NAME}" \
          | jq -r '.projectStatus | "Gate: \(.status)", (.conditions[] | select(.status=="ERROR") | "  \(.metricKey): actual=\(.actualValue) threshold=\(.errorThreshold) (\(.comparator))")'

