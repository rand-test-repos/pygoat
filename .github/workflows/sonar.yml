name: Sonar Analysis

on:
  push:
    branches:
      - master
      - 'feat/**'

jobs:
  sonar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Pillow build dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sqs-dce-shichao.ngrok.io
        with:
          args: >
            -Dsonar.projectKey=rand-test-repos_PyGoat
            -Dsonar.projectName=PyGoat
            -Dsonar.python.version=3.11
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/tests.py
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Show quality gate details
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sqs-dce-shichao.ngrok.io
        run: |
          curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=rand-test-repos_PyGoat&branch=${GITHUB_REF_NAME}" \
          | jq -r '.projectStatus | "Gate: \(.status)", (.conditions[] | select(.status=="ERROR") | "  \(.metricKey): actual=\(.actualValue) threshold=\(.errorThreshold) (\(.comparator))")'
          echo "New-code issues (rules behind issue-based conditions such as new_violations):"
          curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/issues/search?components=rand-test-repos_PyGoat&branch=${GITHUB_REF_NAME}&inNewCodePeriod=true&issueStatuses=OPEN,CONFIRMED&ps=500" \
          | jq -r '.issues[] | "  \(.rule) [\(.severity)] \(.component | split(":")[1]):\(.line // "-") \(.message)"'
          echo "Dependency risks at HIGH or BLOCKER severity (sca_severity_any_security fails at >= HIGH):"
          code=$(curl -s -o sca.json -w '%{http_code}' -H "Authorization: Bearer $SONAR_TOKEN" \
            "$SONAR_HOST_URL/api/v2/sca/issues-releases?projectKey=rand-test-repos_PyGoat&branchKey=${GITHUB_REF_NAME}&qualities=SECURITY&severities=HIGH&severities=BLOCKER&pageSize=500")
          if [ "$code" = 200 ]; then
            jq -r '.issuesReleases | "  \(length) risk(s)", (group_by(.release.packageName + "@" + .release.version)[] | "  \(.[0].release.packageName)@\(.[0].release.version) (\(if .[0].release.directSummary then "direct" else "transitive" end)): " + (map("\(.vulnerabilityId) \(.severity) cvss=\(.cvssScore // "n/a")") | join(", ")))' sca.json
          else
            echo "  SCA API returned HTTP $code: $(head -c 300 sca.json)"
          fi

