name: Sonar Analysis

on:
  push:
    branches:
      - master
      - 'feat/**'

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow build dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sqs-dce-shichao.ngrok.io
        with:
          args: >
            -Dsonar.projectKey=rand-test-repos_PyGoat
            -Dsonar.projectName=PyGoat
            -Dsonar.python.version=3.11
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

