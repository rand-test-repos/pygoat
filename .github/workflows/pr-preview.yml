name: PR preview

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Announce
        run: echo "Building preview for ${{ github.event.pull_request.title }} by ${{ github.event.pull_request.head.ref }}"

      - name: Build
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          pip install -r requirements.txt
          python manage.py collectstatic --noinput

      - uses: some-org/deploy-preview@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
